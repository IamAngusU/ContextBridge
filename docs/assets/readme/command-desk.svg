<svg xmlns="http://www.w3.org/2000/svg" width="800" height="248" viewBox="0 0 800 248" role="img" aria-labelledby="title description">
<title id="title">ContextBridge command desk</title>
<desc id="description">Six real commands for inspecting models, workers, routing, conformance and overhead. Requires the configured services described in the README. These are commands, not fabricated terminal output.</desc>
