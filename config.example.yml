version: 1

server:
  listen: 127.0.0.1:32145
  token: ${CONTEXTBRIDGE_TOKEN}

storage:
  directory: ./data
  inbox: ./inbox
  models: ./models

runtime:
  hardware_refresh_seconds: 10

updates:
  enabled: true
  channel: stable
  repository: IamAngusU/ContextBridge
  check_interval_hours: 24

routes:
  default:
    provider: ollama
    fallback: [browser]
    timeout_seconds: 180
    browser_profile: ""
  inkwall:
    provider: ollama
    fallback: [browser]
    timeout_seconds: 180
    browser_profile: ""
    task: moderation
  extraction:
    provider: nuextract
    fallback: [ollama, browser]
    timeout_seconds: 180
    browser_profile: ""
    task: extraction
  embedding:
    provider: jina
    fallback: [ollama]
    timeout_seconds: 180
    task: embedding
  rag_ingest:
    provider: jina
    timeout_seconds: 180
    task: rag_ingest
  rag_query:
    provider: jina
    timeout_seconds: 180
    task: rag_query

providers:
  ollama:
    url: http://127.0.0.1:11434
    model: auto
    images: true
    timeout_seconds: 45
  browser:
    lease_seconds: 90

engines:
  nuextract:
    type: llama_cpp
    model: nuextract3
    executable: auto
    listen: 127.0.0.1:32146
    auto_start: false
    gpu: prefer
    mode: generation
    timeout_seconds: 120
  jina:
    type: llama_cpp
    model: jina-v4-retrieval
    executable: auto
    listen: 127.0.0.1:32147
    auto_start: false
    gpu: prefer
    mode: embedding
    pooling: mean
    timeout_seconds: 120

models:
  nuextract3:
    repository: numind/NuExtract3-GGUF
    file: NuExtract3-Q4_K_M.gguf
    projector_file: mmproj-NuExtract3-BF16.gguf
    kind: extraction
  jina-v4-retrieval:
    repository: jinaai/jina-embeddings-v4-text-retrieval-GGUF
    file: jina-embeddings-v4-text-retrieval-Q4_K_M.gguf
    kind: embedding
    query_prefix: "Query: "
    passage_prefix: "Passage: "
    dimensions: 2048

tunnel:
  mode: external
  target: ""
  local_port: 0
  remote_port: 0

rag:
  enabled: true
  backend: local
  directory: ./data/rag
  embedding_route: embedding
  max_documents: 10000

cluster:
  # Optional scoped producer credential used by `cluster submit` and `cluster chat`.
  # Prefer an environment expansion in real deployments.
  client_token: ""
  relay:
    enabled: false
    listen: 127.0.0.1:32150
    public_url: https://relay.example.com
    database: ./data/cluster.db
    admin_token: ${CONTEXTBRIDGE_CLUSTER_ADMIN_TOKEN}
    allowed_origins: [relay.example.com]
    max_queue: 10000
    max_job_bytes: 12582912
    pairing_ttl_seconds: 600
  worker:
    enabled: false
    relay_url: https://relay.example.com
    identity_file: ./data/cluster-identity.json
    node_name: auto
    groups: [default]
    tags: [private]
    max_concurrent: 1
    local_url: http://127.0.0.1:32145
    local_token: ${CONTEXTBRIDGE_TOKEN}
    heartbeat_seconds: 5
  policies:
    allowed_tasks: [moderation, generation, extraction, embedding, rag_ingest, rag_query, vision]
    max_attempts: 3
    max_job_runtime_seconds: 900
    max_pipeline_steps: 24
    max_pipeline_runtime_seconds: 1800
  pricing:
    compute_per_hour_usd: 0.18
    input_per_million_usd: 0
    output_per_million_usd: 0
    equivalent_input_per_million_usd: 0.15
    equivalent_output_per_million_usd: 0.60
  pipelines:
    ticket_resolution:
      max_runtime_seconds: 900
      max_iterations: 3
      steps:
        - name: retrieve
          requirements:
            task: rag_query
            group: support
            embedding: true
          input: '${input}'
          retries: 2
          timeout_seconds: 180
        - name: draft
          requirements:
            task: generation
            group: support
          input: '{"route":"default","task":"generation","prompt":"Draft a support reply from this retrieved context.","text":${steps.retrieve.output},"output":{"mode":"text"}}'
          retries: 1
          timeout_seconds: 240

browser_profiles:
  chatgpt:
    label: ChatGPT
    match_url: https://chatgpt.com/*
    selectors:
      input: ['#prompt-textarea', '[contenteditable="true"]']
      file_input: ['input[type="file"]']
      submit: ['button[data-testid="send-button"]', 'button[aria-label*="Send"]']
      response: ['[data-message-author-role="assistant"]', 'section[data-turn="assistant"][data-testid^="conversation-turn-"]']

  gemini:
    label: Gemini
    match_url: https://gemini.google.com/*
    selectors:
      input: ['rich-textarea div[contenteditable="true"][role="textbox"]', 'div[contenteditable="true"][aria-label*="Prompt für Gemini" i]', 'div.ql-editor[contenteditable="true"][role="textbox"]']
      file_input: ['input[type="file"]']
      submit: ['button[data-test-id="send-button"]', 'button[data-testid="send-button"]', 'button[aria-label*="prompt senden" i]', 'button[aria-label*="send message" i]']
      response: ['model-response message-content .markdown[aria-live="polite"]', 'model-response .model-response-text']

  custom_ai:
    label: My browser AI
    match_url: https://ai.example.com/*
    selectors:
      input: ['textarea[name="prompt"]']
      file_input: ['input[type="file"]']
      submit: ['button[type="submit"]']
      response: ['.assistant-message']
