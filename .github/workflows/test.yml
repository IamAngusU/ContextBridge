name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/contextbridge

  package:
    name: Installers, extensions, and docs
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: bash -n install.sh
      - run: php -l web/index.php
      - run: node --check internal/bridge/dashboard/dashboard.js
      - shell: pwsh
        run: "[scriptblock]::Create((Get-Content './install.ps1' -Raw)) | Out-Null"
      - run: ./scripts/package-extensions.sh
      - run: ./scripts/verify-extensions.sh
      - run: git diff --exit-code -- extension/chromium extension/firefox
      - run: npx --yes web-ext@8.4.0 lint --source-dir extension/firefox --warnings-as-errors
      - run: npx --yes markdownlint-cli2@0.18.1 'README.md' 'CHANGELOG.md' 'CONTRIBUTING.md' 'SECURITY.md' 'docs/*.md' 'extension/README.md'
