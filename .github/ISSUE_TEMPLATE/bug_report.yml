name: Bug report
description: Report a reproducible ContextBridge problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make ContextBridge more reliable. Remove tokens and private submitted content from all logs.
  - type: input
    id: version
    attributes:
      label: ContextBridge version
      placeholder: v0.2.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Local service or dashboard
        - Ollama provider
        - Chromium extension
        - Firefox extension
        - Installer or autostart
        - Protocol or integration
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest safe example that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed tokens, credentials, private URLs, and submitted user content.
          required: true
