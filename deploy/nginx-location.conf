location = /contextbridge {
    return 308 /contextbridge/;
}

# Change this path when ContextBridge is installed elsewhere.
location ~ ^/contextbridge/(?:api/stats|install\.sh|install\.ps1|favicon\.svg)$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/contextbridge/web/index.php;
    fastcgi_pass unix:/run/php/php-fpm.sock;
}

location = /contextbridge/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/contextbridge/web/index.php;
    fastcgi_pass unix:/run/php/php-fpm.sock;
}

location = /contextbridge/health {
    proxy_pass http://127.0.0.1:32150/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}

location ^~ /contextbridge/v1/ {
    proxy_pass http://127.0.0.1:32150/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /contextbridge;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 16m;
}

location ^~ /contextbridge/dashboard/ {
    proxy_pass http://127.0.0.1:32150/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /contextbridge/dashboard;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 16m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location /contextbridge/ {
    return 404;
}
